name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:

  test:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier Python
        run: python --version

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier l'application
        run: python -m py_compile appli.py


  codeql:
    name: Analyse CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v3

  trivy:
    name: Scan Docker avec Trivy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t vul-web:latest .

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vul-web:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
